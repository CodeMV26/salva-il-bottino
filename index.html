<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Salva il Bottino - Gemini Advisor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between max-w-md mx-auto px-4 py-5">

  <!-- HEADER -->
  <header class="border-b border-slate-800 pb-3">
    <div class="flex justify-between items-center mb-2">
      <span class="text-[10px] font-bold uppercase tracking-widest text-emerald-400">Salva il Bottino - Gemini Mode</span>
      <div class="space-x-2">
        <button onclick="syncState()" class="text-[11px] text-slate-400 hover:text-emerald-400 underline">Sync Mac/iPhone</button>
        <button onclick="editInitialCapital()" class="text-[11px] text-slate-400 hover:text-emerald-400 underline">Capitale</button>
        <button onclick="resetGame()" class="text-[11px] text-slate-400 hover:text-red-400 underline">Reset</button>
      </div>
    </div>
    <div class="flex items-center justify-between bg-slate-800 p-3 rounded-xl border border-slate-700">
      <div>
        <span class="text-[10px] text-slate-400 block uppercase">Domanda</span>
        <span id="step-display" class="text-base font-black text-white">1 / 15</span>
      </div>
      <div class="text-right cursor-pointer" onclick="editInitialCapital()" title="Clicca per modificare il capitale">
        <span class="text-[10px] text-slate-400 block uppercase">Capitale Residuo ✏️</span>
        <span id="capital-display" class="text-xl font-black text-emerald-400">3.000 €</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="space-y-4 my-auto">
    
    <!-- PASSO 1: INPUT DOMANDA & GENERAZIONE PROMPT -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">1. Incolla partita e domanda del quiz</label>
        <textarea id="question-text" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors" placeholder="Es. Villareal vs Levante: Il Villareal segnerà almeno 2 goal?"></textarea>
      </div>

      <button onclick="copyPromptForGemini()" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold py-2.5 rounded-lg text-xs transition-all shadow-md flex justify-center items-center gap-2">
        <span>📋 1. Copia Prompt per Gemini</span>
      </button>
    </div>

    <!-- PASSO 2: INCOLLA RISPOSTA DI GEMINI -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">2. Incolla qui la risposta di Gemini</label>
        <textarea id="gemini-response" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors" placeholder="Incolla qui la risposta generata da Gemini..."></textarea>
      </div>

      <button onclick="processGeminiResponse()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-bold py-2.5 rounded-lg text-xs transition-all shadow-md flex justify-center items-center gap-2">
        <span>⚡ 2. Calcola Ripartizione Bottino</span>
      </button>
    </div>

    <!-- OUTPUT CARD -->
    <div id="output-card" class="hidden bg-slate-800 p-4 rounded-xl border border-emerald-500/40 space-y-3">
      
      <div class="border-b border-slate-700 pb-2">
        <div class="flex justify-between items-center">
          <span id="phase-badge" class="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">Fase 1</span>
          <span id="confidence-badge" class="text-[10px] font-bold text-slate-300">Confidenza SÌ: --%</span>
        </div>
        <p id="advice-body" class="text-xs text-slate-300 mt-2 leading-relaxed"></p>
      </div>

      <!-- PUNTATE CALCOLATE -->
      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="bg-emerald-950/40 border border-emerald-500/30 p-2 rounded-lg">
          <span class="text-[10px] uppercase font-bold text-emerald-400 block">Punta sul SÌ</span>
          <span id="bet-yes" class="text-base font-black text-emerald-300">0 €</span>
        </div>
        <div class="bg-rose-950/40 border border-rose-500/30 p-2 rounded-lg">
          <span class="text-[10px] uppercase font-bold text-rose-400 block">Punta sul NO</span>
          <span id="bet-no" class="text-base font-black text-rose-300">0 €</span>
        </div>
      </div>

      <!-- CONSIGLI & TRAPPOLE -->
      <div class="text-[11px] space-y-1 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50">
        <p class="text-emerald-400"><strong class="font-semibold">Consiglio Strategico:</strong> <span id="rec-bets" class="text-slate-300"></span></p>
        <p class="text-rose-400"><strong class="font-semibold">Trappola da Evitare:</strong> <span id="avoid-bets" class="text-slate-300"></span></p>
      </div>

      <!-- CONFERMA ESITO -->
      <div class="pt-2 border-t border-slate-700">
        <span class="block text-xs font-semibold text-center text-slate-300 mb-2">Com'è finita la partita?</span>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="registerResult('YES')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition-colors">
            Vinto SÌ (Avanza)
          </button>
          <button onclick="registerResult('NO')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 rounded-lg text-xs transition-colors">
            Vinto NO (Avanza)
          </button>
        </div>
      </div>

    </div>

  </main>

  <!-- STORICO -->
  <footer class="mt-4">
    <details class="text-xs text-slate-400 bg-slate-800/40 rounded-lg p-2 border border-slate-800" open>
      <summary class="font-semibold cursor-pointer text-slate-300">Storico Domande (<span id="history-count">0</span>/15)</summary>
      <div id="history-list" class="mt-2 space-y-1 max-h-36 overflow-y-auto text-[11px] divide-y divide-slate-800"></div>
    </details>
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let state = {
      step: 1,
      capital: 3000,
      currentYesBet: 0,
      currentNoBet: 0,
      history: [],
      currentQuestion: "",
      lastAnalysis: null
    };

    window.onload = () => {
      loadState();
      updateUI();
    };

    function saveState() {
      state.currentQuestion = document.getElementById('question-text').value;
      localStorage.setItem('bottino_gemini_manual_state', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('bottino_gemini_manual_state');
      if (saved) {
        try {
          state = JSON.parse(saved);
          if (state.currentQuestion) {
            document.getElementById('question-text').value = state.currentQuestion;
          }
          if (state.lastAnalysis) {
            renderOutputCard(state.lastAnalysis);
          }
        } catch (e) {
          console.error("Errore caricamento stato", e);
        }
      }
    }

    function editInitialCapital() {
      const input = prompt("Inserisci la nuova cifra del capitale (es. 3000):", state.capital);
      if (input !== null) {
        const parsed = parseFloat(input.replace(/[^\d.]/g, ''));
        if (!isNaN(parsed) && parsed >= 0) {
          state.capital = parsed;
          saveState();
          updateUI();
        }
      }
    }

    function syncState() {
      const option = prompt("Digita 'E' per ESPORTARE il codice partita o 'I' per IMPORTARLO da un altro dispositivo:", "E");
      if (!option) return;

      if (option.toUpperCase() === 'E') {
        const code = btoa(JSON.stringify(state));
        navigator.clipboard.writeText(code);
        alert("Codice di sincronizzazione copiato negli appunti! Invialo sul tuo iPhone via AirDrop o Messaggi ed importalo nell'app.");
      } else if (option.toUpperCase() === 'I') {
        const code = prompt("Incolla qui il codice di sincronizzazione:");
        if (code) {
          try {
            state = JSON.parse(atob(code.trim()));
            saveState();
            updateUI();
            if (state.lastAnalysis) renderOutputCard(state.lastAnalysis);
            alert("Partita sincronizzata con successo!");
          } catch (e) {
            alert("Codice non valido.");
          }
        }
      }
    }

    function updateUI() {
      document.getElementById('step-display').innerText = `${state.step} / 15`;
      document.getElementById('capital-display').innerText = `${Math.round(state.capital).toLocaleString('it-IT')} €`;
      document.getElementById('history-count').innerText = state.history.length;

      const list = document.getElementById('history-list');
      if (state.history.length === 0) {
        list.innerHTML = `<p class="text-slate-500 text-center py-1">Nessun turno giocato.</p>`;
      } else {
        list.innerHTML = state.history.map((h, i) => `
          <div class="py-1 flex justify-between items-center">
            <span class="truncate max-w-[170px]">#${i+1}: ${h.q}</span>
            <span class="font-bold ${h.salvato > 0 ? 'text-emerald-400' : 'text-rose-400'}">${Math.round(h.salvato)} €</span>
          </div>
        `).join('');
      }
    }

    function copyPromptForGemini() {
      const qText = document.getElementById('question-text').value.trim();
      if (!qText) return alert("Inserisci prima la domanda del quiz!");

      saveState();

      const promptText = `Agisci come un consulente esperto per il quiz "Salva il Bottino".
Capitale attuale da gestire: ${state.capital}€. Domanda ${state.step} di 15.
Analizza questa domanda/evento: "${qText}".

Fornisci una valutazione ed un pronostico dettagliato ed equilibrato per decidere quanto puntare.
Per permettere alla mia applicazione di elaborare i dati, rispondi usando ESATTAMENTE questo formato nel testo:

ANALISI: <Scrivi qui l'analisi dettagliata ed equilibrata sul match>
PERCENTUALE: <Inserisci solo il numero della percentuale di confidenza nel SÌ da 0 a 100>
CONSIGLIO: <Scrivi i consigli sulla distribuzione del bottino e la strategia>
EVITARE: <Scrivi le scommesse o trappole da evitare>`;

      navigator.clipboard.writeText(promptText).then(() => {
        alert("Prompt copiato negli appunti! Ora aprilo in Gemini, incolla e poi copia la risposta di Gemini nell'app.");
      }).catch(err => {
        alert("Errore nel copiare negli appunti. Seleziona il testo manualmente.");
      });
    }

    function processGeminiResponse() {
      const rawText = document.getElementById('gemini-response').value.trim();
      if (!rawText) return alert("Incolla prima la risposta ottenuta da Gemini!");

      let analisi = "Analisi caricata da Gemini.";
      let percentuale = 65;
      let consiglio = "Distribuzione del capitale in base alla fase.";
      let evitare = "Evitare azzardi incontrollati.";

      const matchAnalisi = rawText.match(/ANALISI:\s*([\s\S]*?)(?=PERCENTUALE:|$)/i);
      if (matchAnalisi && matchAnalisi[1].trim()) analisi = matchAnalisi[1].trim();

      const matchPercentuale = rawText.match(/PERCENTUALE:\s*(\d+)/i);
      if (matchPercentuale) percentuale = parseInt(matchPercentuale[1]);

      const matchConsiglio = rawText.match(/CONSIGLIO:\s*([\s\S]*?)(?=EVITARE:|$)/i);
      if (matchConsiglio && matchConsiglio[1].trim()) consiglio = matchConsiglio[1].trim();

      const matchEvitare = rawText.match(/EVITARE:\s*([\s\S]*?)$/i);
      if (matchEvitare && matchEvitare[1].trim()) evitare = matchEvitare[1].trim();

      let pYes = percentuale / 100;
      if (state.step <= 5) {
        pYes = pYes >= 0.70 ? 0.70 : (pYes <= 0.30 ? 0.30 : pYes);
      }

      state.currentYesBet = Math.round(state.capital * pYes);
      state.currentNoBet = state.capital - state.currentYesBet;

      state.lastAnalysis = {
        analisi,
        percentuale,
        consiglio,
        evitare,
        yesBet: state.currentYesBet,
        noBet: state.currentNoBet,
        step: state.step
      };

      saveState();
      renderOutputCard(state.lastAnalysis);
    }

    function renderOutputCard(data) {
      document.getElementById('phase-badge').innerText = `Fase ${data.step <= 5 ? 1 : data.step <= 11 ? 2 : 3}`;
      document.getElementById('advice-body').innerText = data.analisi;
      document.getElementById('confidence-badge').innerText = `Confidenza SÌ: ${data.percentuale}%`;
      document.getElementById('bet-yes').innerText = `${data.yesBet.toLocaleString('it-IT')} €`;
      document.getElementById('bet-no').innerText = `${data.noBet.toLocaleString('it-IT')} €`;
      document.getElementById('rec-bets').innerText = data.consiglio;
      document.getElementById('avoid-bets').innerText = data.evitare;

      document.getElementById('output-card').classList.remove('hidden');
    }

    function registerResult(esito) {
      const qText = document.getElementById('question-text').value;
      const salvato = esito === 'YES' ? state.currentYesBet : state.currentNoBet;

      state.history.push({ q: qText, winEsito: esito, salvato: salvato });
      state.capital = salvato;
      state.step += 1;
      state.lastAnalysis = null;
      state.currentQuestion = "";

      saveState();

      document.getElementById('question-text').value = '';
      document.getElementById('gemini-response').value = '';
      document.getElementById('output-card').classList.add('hidden');

      if (state.step > 15 || state.capital <= 0) {
        alert(state.capital > 0 
          ? `Scalata completata! Sei riuscito a salvare ${Math.round(state.capital)} €!` 
          : `Capitale esaurito al turno ${state.step - 1}.`);
      }

      updateUI();
    }

    function resetGame() {
      if (confirm("Vuoi resettare la partita, azzerare il capitale e cancellare lo storico salvato?")) {
        state = {
          step: 1,
          capital: 3000,
          currentYesBet: 0,
          currentNoBet: 0,
          history: [],
          currentQuestion: "",
          lastAnalysis: null
        };
        localStorage.removeItem('bottino_gemini_manual_state');
        document.getElementById('question-text').value = '';
        document.getElementById('gemini-response').value = '';
        document.getElementById('output-card').classList.add('hidden');
        updateUI();
      }
    }
  </script>
</body>
</html>
