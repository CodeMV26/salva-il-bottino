<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Salva il Bottino - Strategy Advisor</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Prevenzione di rimbalzi e scroll impropri su Safari iOS */
    html, body {
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between max-w-md mx-auto px-4 py-6">

  <!-- HEADER & STATUS BAR -->
  <header class="text-center mb-4 border-b border-slate-800 pb-3">
    <div class="flex justify-between items-center mb-1">
      <span class="text-xs font-bold uppercase tracking-widest text-emerald-400">Bottino Predictor</span>
      <button onclick="resetGame()" class="text-xs text-slate-400 hover:text-red-400 underline">Reset Game</button>
    </div>
    <div class="flex items-center justify-between bg-slate-800 p-3 rounded-xl border border-slate-700">
      <div class="text-left">
        <span class="text-xs text-slate-400 block">Domanda</span>
        <span id="step-display" class="text-lg font-black text-white">1 / 15</span>
      </div>
      <div class="text-right">
        <span class="text-xs text-slate-400 block">Capitale Attuale</span>
        <span id="capital-display" class="text-xl font-black text-emerald-400">3.000 €</span>
      </div>
    </div>
  </header>

  <!-- FORM DI INPUT DOMANDA -->
  <main class="space-y-4 my-auto">
    
    <!-- Box Domanda e Tipologia -->
    <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700/60 shadow-lg space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Testo della Domanda</label>
        <textarea id="question-text" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors" placeholder="Es. L'Everton vincerà almeno un tempo?"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Tipo Scommessa</label>
          <select id="market-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
            <option value="high">Alta Probabilità (Quota < 1.45)</option>
            <option value="medium">Media (Quota 1.50 - 1.85)</option>
            <option value="low">Azzardo / 50-50 (Quota > 1.90)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Confidenza SÌ</label>
          <select id="confidence" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
            <option value="80">Molto Alta (80%+)</option>
            <option value="65" selected>Media (60% - 70%)</option>
            <option value="50">Incerta (50%)</option>
            <option value="35">Bassa (Sotto il 40%)</option>
          </select>
        </div>
      </div>

      <button onclick="calculateStrategy()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition-all shadow-md">
        Calcola Strategia Avanzata
      </button>
    </div>

    <!-- STRATEGIA E RIPARTIZIONE BOTTINO (OUTPUT) -->
    <div id="output-card" class="hidden bg-slate-800 p-4 rounded-xl border border-emerald-500/30 space-y-3">
      
      <div class="border-b border-slate-700 pb-2">
        <span id="phase-badge" class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">
          Fase 1: Accumulo
        </span>
        <h3 id="advice-title" class="text-sm font-bold text-white mt-1">Consiglio Strategico</h3>
        <p id="advice-body" class="text-xs text-slate-300 mt-1 leading-relaxed"></p>
      </div>

      <!-- Tabella Puntate -->
      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="bg-emerald-950/40 border border-emerald-500/30 p-2.5 rounded-lg">
          <span class="text-[10px] uppercase font-bold text-emerald-400 block">Punta sul SÌ</span>
          <span id="bet-yes" class="text-lg font-black text-emerald-300">0 €</span>
        </div>
        <div class="bg-rose-950/40 border border-rose-500/30 p-2.5 rounded-lg">
          <span class="text-[10px] uppercase font-bold text-rose-400 block">Punta sul NO</span>
          <span id="bet-no" class="text-lg font-black text-rose-300">0 €</span>
        </div>
      </div>

      <!-- Scommesse Consigliate / Da Evitare -->
      <div class="text-[11px] space-y-1 bg-slate-900/60 p-2.5 rounded-lg">
        <p class="text-emerald-400"><strong class="font-semibold"> Consigliate:</strong> <span id="rec-bets" class="text-slate-300"></span></p>
        <p class="text-rose-400"><strong class="font-semibold"> Da Evitare:</strong> <span id="avoid-bets" class="text-slate-300"></span></p>
      </div>

      <!-- CONFERMA ESITO -->
      <div class="pt-2 border-t border-slate-700">
        <span class="block text-xs font-semibold text-center text-slate-300 mb-2">Qual è stato l'esito reale?</span>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="registerResult('YES')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition-colors">
            Ha vinto il SÌ
          </button>
          <button onclick="registerResult('NO')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 rounded-lg text-xs transition-colors">
            Ha vinto il NO
          </button>
        </div>
      </div>

    </div>

  </main>

  <!-- CRONOLOGIA / FOOTER -->
  <footer class="mt-4">
    <details class="text-xs text-slate-400 bg-slate-800/40 rounded-lg p-2 border border-slate-800">
      <summary class="font-semibold cursor-pointer text-slate-300">Storico Scalata (<span id="history-count">0</span>/15)</summary>
      <div id="history-list" class="mt-2 space-y-1 max-h-32 overflow-y-auto text-[11px] divide-y divide-slate-800">
        <p class="text-slate-500 text-center py-1">Nessuna domanda registrata.</p>
      </div>
    </details>
  </footer>

  <!-- LOGICA JAVASCRIPT VANILLA -->
  <script>
    let state = {
      step: 1,
      capital: 3000,
      currentYesBet: 0,
      currentNoBet: 0,
      history: []
    };

    // Inizializzazione da LocalStorage se esistente
    window.onload = () => {
      const saved = localStorage.getItem('bottino_state');
      if (saved) {
        state = JSON.parse(saved);
      }
      updateUI();
    };

    function saveState() {
      localStorage.setItem('bottino_state', JSON.stringify(state));
    }

    function updateUI() {
      document.getElementById('step-display').innerText = `${state.step} / 15`;
      document.getElementById('capital-display').innerText = `${Math.round(state.capital).toLocaleString('it-IT')} €`;
      document.getElementById('history-count').innerText = state.history.length;

      // Storico
      const list = document.getElementById('history-list');
      if (state.history.length === 0) {
        list.innerHTML = `<p class="text-slate-500 text-center py-1">Nessuna domanda registrata.</p>`;
      } else {
        list.innerHTML = state.history.map((h, i) => `
          <div class="py-1 flex justify-between items-center">
            <span class="truncate max-w-[180px]">#${i+1}: ${h.q}</span>
            <span class="font-bold ${h.win ? 'text-emerald-400' : 'text-rose-400'}">${Math.round(h.salvato)} € (${h.winEsito})</span>
          </div>
        `).join('');
      }
    }

    function calculateStrategy() {
      const text = document.getElementById('question-text').value.trim();
      const market = document.getElementById('market-type').value;
      const confidence = parseInt(document.getElementById('confidence').value);

      if (!text) {
        alert("Inserisci il testo della domanda per continuare.");
        return;
      }

      let ratioYes = 0.5;
      let phaseText = "";
      let adviceText = "";
      let recBets = "";
      let avoidBets = "";

      // Determinazione della Fase
      if (state.step <= 5) {
        phaseText = "Fase 1: Accumulo Capitale";
        recBets = "Esiti finali favoriti netti, Under/Over con margini ampi, Gol nei 90'.";
        avoidBets = "Risultati esatti, Marcatori specifici, Combo complesse.";
      } else if (state.step <= 11) {
        phaseText = "Fase 2: Gestione & Mantenimento";
        recBets = "Squadra di casa vince un tempo, Over 1.5 Squadra, Handicap +2.";
        avoidBets = "Somma gol esatta, Cartellini nei primi 15', Calci d'angolo 1X2.";
      } else {
        phaseText = "Fase 3: Protezione Bonus Finale";
        recBets = "Doppia chance (1X/X2), Gol Casa, Mercati a bassissima varianza.";
        avoidBets = "Qualsiasi mercato con quote pari (1.85 / 1.85) senza copertura.";
      }

      // Algoritmo di Ripartizione
      if (state.step <= 5 && confidence >= 65) {
        // Forza aggressività nelle prime 5
        ratioYes = confidence >= 65 ? (confidence / 100) : 0.5;
        if (confidence >= 80) ratioYes = 1.0; // All-In Strategico
        adviceText = "Nelle prime fasi è fondamentale mantenere alto il montepremi. Se hai buona fiducia, spingi con un All-In o uno split asimmetrico accentuato.";
      } else {
        // Fasi avanzate o bassa confidenza: protezione progressiva
        ratioYes = confidence / 100;
        adviceText = "Proteggi la vittoria applicando una ripartizione proporzionale alle probabilità stimate. Evita di rischiare l'intero capitale.";
      }

      state.currentYesBet = Math.round(state.capital * ratioYes);
      state.currentNoBet = state.capital - state.currentYesBet;

      // Render dei Risultati
      document.getElementById('phase-badge').innerText = phaseText;
      document.getElementById('advice-body').innerText = adviceText;
      document.getElementById('bet-yes').innerText = `${state.currentYesBet.toLocaleString('it-IT')} €`;
      document.getElementById('bet-no').innerText = `${state.currentNoBet.toLocaleString('it-IT')} €`;
      document.getElementById('rec-bets').innerText = recBets;
      document.getElementById('avoid-bets').innerText = avoidBets;

      document.getElementById('output-card').classList.remove('hidden');
    }

    function registerResult(esito) {
      const qText = document.getElementById('question-text').value;
      const salvato = esito === 'YES' ? state.currentYesBet : state.currentNoBet;

      state.history.push({
        q: qText,
        winEsito: esito,
        salvato: salvato,
        win: salvato > 0
      });

      state.capital = salvato;
      state.step += 1;

      saveState();

      // Clear Form & Output Card
      document.getElementById('question-text').value = '';
      document.getElementById('output-card').classList.add('hidden');

      if (state.step > 15 || state.capital <= 0) {
        alert(state.capital > 0 
          ? ` Scalata Completata! Hai salvato ${Math.round(state.capital)} € in Bonus Scommesse!` 
          : ` Game Over! Il tuo capitale si è azzerato al turno ${state.step - 1}.`);
      }

      updateUI();
    }

    function resetGame() {
      if (confirm("Vuoi azzerare la partita e ricominciare da 3.000 € alla domanda 1?")) {
        state = { step: 1, capital: 3000, currentYesBet: 0, currentNoBet: 0, history: [] };
        localStorage.removeItem('bottino_state');
        document.getElementById('output-card').classList.add('hidden');
        updateUI();
      }
    }
  </script>
</body>
</html>
