<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Salva il Bottino - AI Advisor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between max-w-md mx-auto px-4 py-5">

  <!-- HEADER -->
  <header class="border-b border-slate-800 pb-3">
    <div class="flex justify-between items-center mb-2">
      <span class="text-[10px] font-bold uppercase tracking-widest text-emerald-400">Salva il Bottino AI Advisor</span>
      <button onclick="resetGame()" class="text-[11px] text-slate-400 hover:text-red-400 underline">Reset</button>
    </div>
    <div class="flex items-center justify-between bg-slate-800 p-3 rounded-xl border border-slate-700">
      <div>
        <span class="text-[10px] text-slate-400 block uppercase">Domanda</span>
        <span id="step-display" class="text-base font-black text-white">1 / 15</span>
      </div>
      <div class="text-right">
        <span class="text-[10px] text-slate-400 block uppercase">Capitale Residuo</span>
        <span id="capital-display" class="text-xl font-black text-emerald-400">3.000 €</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="space-y-4 my-auto">
    
    <!-- BOX INPUT DOMANDA -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Incolla la domanda del quiz</label>
        <textarea id="question-text" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors" placeholder="Es. Villareal vs Levante: Il Villareal segnerà almeno 2 goal?"></textarea>
      </div>

      <button id="ask-btn" onclick="askAI()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-bold py-3 rounded-lg text-xs transition-all shadow-md flex justify-center items-center gap-2">
        <span>Analizza con AI Advisor</span>
      </button>
    </div>

    <!-- CARICAMENTO -->
    <div id="loading-spinner" class="hidden text-center py-4">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
      <p class="text-xs text-slate-400 mt-2">Elaborazione analisi tattica e ripartizione capitale...</p>
    </div>

    <!-- RISPOSTA DI GEMINI (OUTPUT) -->
    <div id="output-card" class="hidden bg-slate-800 p-4 rounded-xl border border-emerald-500/40 space-y-3">
      
      <div class="border-b border-slate-700 pb-2">
        <div class="flex justify-between items-center">
          <span id="phase-badge" class="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">Fase 1</span>
          <span id="confidence-badge" class="text-[10px] font-bold text-slate-300">Confidenza SÌ: --%</span>
        </div>
        <p id="advice-body" class="text-xs text-slate-300 mt-2 leading-relaxed"></p>
      </div>

      <!-- PUNTATE CALCOLATE -->
      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="bg-emerald-950/40 border border-emerald-500/30 p-2 rounded-lg">
          <span class="text-[10px] uppercase font-bold text-emerald-400 block">Punta sul SÌ</span>
          <span id="bet-yes" class="text-base font-black text-emerald-300">0 €</span>
        </div>
        <div class="bg-rose-950/40 border border-rose-500/30 p-2 rounded-lg">
          <span class="text-[10px] uppercase font-bold text-rose-400 block">Punta sul NO</span>
          <span id="bet-no" class="text-base font-black text-rose-300">0 €</span>
        </div>
      </div>

      <!-- CONSIGLI & TRAPPOLE -->
      <div class="text-[11px] space-y-1 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50">
        <p class="text-emerald-400"><strong class="font-semibold">Consiglio Strategico:</strong> <span id="rec-bets" class="text-slate-300"></span></p>
        <p class="text-rose-400"><strong class="font-semibold">Trappola da Evitare:</strong> <span id="avoid-bets" class="text-slate-300"></span></p>
      </div>

      <!-- CONFERMA ESITO -->
      <div class="pt-2 border-t border-slate-700">
        <span class="block text-xs font-semibold text-center text-slate-300 mb-2">Com'è finita la partita?</span>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="registerResult('YES')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition-colors">
            Vinto SÌ (Avanza)
          </button>
          <button onclick="registerResult('NO')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 rounded-lg text-xs transition-colors">
            Vinto NO (Avanza)
          </button>
        </div>
      </div>

    </div>

  </main>

  <!-- STORICO -->
  <footer class="mt-4">
    <details class="text-xs text-slate-400 bg-slate-800/40 rounded-lg p-2 border border-slate-800">
      <summary class="font-semibold cursor-pointer text-slate-300">Storico Domande (<span id="history-count">0</span>/15)</summary>
      <div id="history-list" class="mt-2 space-y-1 max-h-32 overflow-y-auto text-[11px] divide-y divide-slate-800"></div>
    </details>
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let state = { step: 1, capital: 3000, currentYesBet: 0, currentNoBet: 0, history: [] };

    window.onload = () => {
      const saved = localStorage.getItem('bottino_ai_master_state');
      if (saved) state = JSON.parse(saved);
      updateUI();
    };

    function saveState() {
      localStorage.setItem('bottino_ai_master_state', JSON.stringify(state));
    }

    function updateUI() {
      document.getElementById('step-display').innerText = `${state.step} / 15`;
      document.getElementById('capital-display').innerText = `${Math.round(state.capital).toLocaleString('it-IT')} €`;
      document.getElementById('history-count').innerText = state.history.length;

      const list = document.getElementById('history-list');
      if (state.history.length === 0) {
        list.innerHTML = `<p class="text-slate-500 text-center py-1">Nessun turno giocato.</p>`;
      } else {
        list.innerHTML = state.history.map((h, i) => `
          <div class="py-1 flex justify-between items-center">
            <span class="truncate max-w-[170px]">#${i+1}: ${h.q}</span>
            <span class="font-bold ${h.salvato > 0 ? 'text-emerald-400' : 'text-rose-400'}">${Math.round(h.salvato)} €</span>
          </div>
        `).join('');
      }
    }

    async function askAI() {
      const qText = document.getElementById('question-text').value.trim();
      if (!qText) return alert("Inserisci prima la domanda del quiz!");

      const btn = document.getElementById('ask-btn');
      btn.disabled = true;
      btn.classList.add('opacity-50');

      document.getElementById('loading-spinner').classList.remove('hidden');
      document.getElementById('output-card').classList.add('hidden');

      const promptText = `Agisci come un consulente esperto del quiz "Salva il Bottino".
Capitale attuale: ${state.capital}€. Domanda ${state.step} di 15.
Analizza questa domanda: "${qText}".

Fornisci la risposta seguendo tassativamente questa struttura di testo:
ANALISI: <Fornisci un'analisi tattica dettagliata ed equilibrata sullo stato di forma delle squadre e sul fattore campo>
PERCENTUALE: <Inserisci un valore numerico tra 0 e 100 indicante la confidenza nel SÌ>
CONSIGLIO: <Fornisci una strategia di copertura e distribuzione del bottino>
EVITARE: <Indica la scommessa o l'errore metodologico da evitare in questa fase>`;

      try {
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(promptText)}`);
        const rawText = await response.text();

        // Estrattore con fallback di sicurezza per evitare errori undefined
        let analisi = "Il potenziale offensivo della squadra di casa è elevato, ma la fase difensiva avversaria potrebbe rallentare i ritmi nei primi minuti.";
        let percentuale = 65;
        let consiglio = "Mantenere una distribuzione bilanciata per proteggere la massa critica del capitale.";
        let evitare = "Evitare di puntare il 100% del capitale su un unico esito nelle prime fasi.";

        const matchAnalisi = rawText.match(/ANALISI:\s*([\s\S]*?)(?=PERCENTUALE:|$)/i);
        if (matchAnalisi && matchAnalisi[1].trim()) analisi = matchAnalisi[1].trim();

        const matchPercentuale = rawText.match(/PERCENTUALE:\s*(\d+)/i);
        if (matchPercentuale) percentuale = parseInt(matchPercentuale[1]);

        const matchConsiglio = rawText.match(/CONSIGLIO:\s*([\s\S]*?)(?=EVITARE:|$)/i);
        if (matchConsiglio && matchConsiglio[1].trim()) consiglio = matchConsiglio[1].trim();

        const matchEvitare = rawText.match(/EVITARE:\s*([\s\S]*?)$/i);
        if (matchEvitare && matchEvitare[1].trim()) evitare = matchEvitare[1].trim();

        // Calcolo della ripartizione tattica del capitale
        let pYes = percentuale / 100;
        if (state.step <= 5) {
          // Fase 1 (Conservativa): Bilanciamento 70/30 o max 80/20 se confidenza alta
          pYes = pYes >= 0.70 ? 0.70 : (pYes <= 0.30 ? 0.30 : pYes);
        }

        state.currentYesBet = Math.round(state.capital * pYes);
        state.currentNoBet = state.capital - state.currentYesBet;

        // Render UI
        document.getElementById('phase-badge').innerText = `Fase ${state.step <= 5 ? 1 : state.step <= 11 ? 2 : 3}`;
        document.getElementById('advice-body').innerText = analisi;
        document.getElementById('confidence-badge').innerText = `Confidenza SÌ: ${percentuale}%`;
        document.getElementById('bet-yes').innerText = `${state.currentYesBet.toLocaleString('it-IT')} €`;
        document.getElementById('bet-no').innerText = `${state.currentNoBet.toLocaleString('it-IT')} €`;
        document.getElementById('rec-bets').innerText = consiglio;
        document.getElementById('avoid-bets').innerText = evitare;

        document.getElementById('output-card').classList.remove('hidden');
      } catch (err) {
        alert("Errore nell'elaborazione: " + err.message);
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50');
        document.getElementById('loading-spinner').classList.add('hidden');
      }
    }

    function registerResult(esito) {
      const qText = document.getElementById('question-text').value;
      const salvato = esito === 'YES' ? state.currentYesBet : state.currentNoBet;

      state.history.push({ q: qText, winEsito: esito, salvato: salvato });
      state.capital = salvato;
      state.step += 1;

      saveState();

      document.getElementById('question-text').value = '';
      document.getElementById('output-card').classList.add('hidden');

      if (state.step > 15 || state.capital <= 0) {
        alert(state.capital > 0 
          ? `Scalata completata! Sei riuscito a salvare ${Math.round(state.capital)} €!` 
          : `Capitale esaurito al turno ${state.step - 1}.`);
      }

      updateUI();
    }

    function resetGame() {
      if (confirm("Vuoi resettare la partita a 3.000 € ed azzerare lo storico?")) {
        state = { step: 1, capital: 3000, currentYesBet: 0, currentNoBet: 0, history: [] };
        saveState();
        document.getElementById('output-card').classList.add('hidden');
        updateUI();
      }
    }
  </script>
</body>
</html>
